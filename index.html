                        </div>
                        <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-4">

                        <div>

                                    <span id="tooltip-interest-rate" class="tooltip absolute bottom-full left-1/2 transform -translate-x-1/2 mb-2 w-48 p-2 bg-gray-800 text-white text-xs rounded shadow-lg opacity-0 invisible group-hover:opacity-100 group-hover:visible transition-opacity duration-300">
                                        The interest rate of your loan.

                                </span>
                            </label>

                                        <span id="tooltip-water" class="tooltip absolute bottom-full left-1/2 transform -translate-x-1/2 mb-2 w-48 p-2 bg-gray-800 text-white text-xs rounded shadow-lg opacity-0 invisible group-hover:opacity-100 group-hover:visible transition-opacity duration-300">

                            <div>

                                            Estimated electricity costs for the property.

                                <div class="relative">

                            </div>

                        <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-4">                       
                            <div class="">

                                    <span class="relative inline-block cursor-help group">

                    <!-- ================= RENT ROLL ================= -->
                    <div class="">
                        <!-- Unit Rows -->

                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-4">

                                    <span class="text-blue-600 cursor-pointer">ℹ️</span>
                                    <span id="tooltip-vacancy-rate" class="tooltip absolute bottom-full left-1/2 transform -translate-x-1/2 mb-2 w-48 p-2 bg-gray-800 text-white text-xs rounded shadow-lg opacity-0 invisible group-hover:opacity-100 group-hover:visible transition-opacity duration-300">

                                    </span>
                                </span>

                        <div>

                                    <span class="text-blue-600 cursor-pointer">ℹ️</span>
                                    <span id="tooltip-management-fee" class="tooltip absolute bottom-full left-1/2 transform -translate-x-1/2 mb-2 w-48 p-2 bg-gray-800 text-white text-xs rounded shadow-lg opacity-0 invisible group-hover:opacity-100 group-hover:visible transition-opacity duration-300">
                                        Management Fee.
                                    </span>
                                </span>

                            <div class="flex items-center border border-gray-300 rounded p-2">
                                <input type="text" id="management-fee" class="w-full outline-none" placeholder="E.g., 5" step="0.01" required>

                    </form>

                    </div>

            <p id="disclaimer" class="text-xs text-center text-gray-500 mt-6">

            </p>

    <script>
        document.querySelectorAll("input[type='text']").forEach(input => {
            input.addEventListener("blur", function () {
                let value = this.value.replace(/,/g, ''); // Remove existing commas
                if (!isNaN(value) && value !== '') {
                    this.value = parseFloat(value).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
                }
            });

            input.addEventListener("input", function () {
                let value = this.value.replace(/,/g, '').replace(/[^\d.]/g, ''); // Remove non-numeric characters except "."
                if (!isNaN(value) && value !== '') {
                    this.value = value.replace(/\B(?=(\d{3})+(?!\d))/g, ','); // Add commas dynamically
                }
            });
        });


       let language = 'en';

        document.getElementById("language-toggle").addEventListener("click", function() {
            language = language === 'en' ? 'es' : 'en';
            updateLanguage();
        });

        function printResults() {
            window.print();
        }

        function calculate() {

            // Check if any required field is empty
            const requiredFields = [

                'water-sewer', 'garbage', 'gas', 'water', 'electricity', 'pest-control'
            ];

            for (let fieldId of requiredFields) {
                const field = document.getElementById(fieldId);
                if (!field.value || (field.type === 'number' && isNaN(field.value))) {
                    alert('Please fill in all the required fields.');
                    return;
                }
            }

            function getNumericValue(id) {
                let value = document.getElementById(id).value.replace(/,/g, ''); // Remove commas

            const renovationCost = getNumericValue('renovation-cost');

            const holdingPeriod = getNumericValue('holding-period');

            const propertyTaxes = getNumericValue('property-taxes') / 12;

            const capex = getNumericValue('capex') / 100;

            const managementFee = getNumericValue('management-fee') / 100;

                    total_loan_amount = homePrice - (homePrice * downPaymentPercentage);

                    showRenovationCost += renovationCost;
            }

            const totalMonthlyCost = monthlyInterest_v2 + propertyTaxes + insurance + totalMonthlyUtilities;

            const totalHoldingCost = totalMonthlyCost * holdingPeriod;

  <script>

    // Select all inputs that should accept only positive numbers
    // Enforce digits only for all number inputs
    document.querySelectorAll('input[type="text"]').forEach(input => {
    input.addEventListener('input', (e) => {
    e.target.value = e.target.value
        .replace(/[^0-9.]/g, '')     // Remove everything except digits and dot
        .replace(/(\..*)\./g, '$1'); // Allow only one decimal point
    });
    });

    const unitSelect = document.getElementById('unitSelect');
    const rentFields = document.getElementById('rentFields');

    unitSelect.addEventListener('change', () => {
      const units = parseInt(unitSelect.value || 0);
      rentFields.innerHTML = '';

      for (let i = 1; i <= units; i++) {
        const field = document.createElement('div');
        field.innerHTML = `
          <label id="label-unit-${i}" class="block text-sm font-medium mb-1">Unit ${i}</label>
            <div class="relative mb-2">
                <span class="absolute inset-y-0 left-2 flex items-center text-gray-500">$</span>
                <input type="text" id="unit-${i}" class="w-full p-2 pl-8 border border-gray-300 rounded" placeholder="E.g., 3000" required>
            </div>
        `;
        rentFields.appendChild(field);
      }
    });
  </script>
